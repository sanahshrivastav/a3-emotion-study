<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emotion Classification Study</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17212d;background:#f4f6fa}*{box-sizing:border-box}main{max-width:690px;margin:55px auto;padding:32px;background:white;border:1px solid #e4e8ee;border-radius:18px;box-shadow:0 8px 28px #14263b0d}h1{font-size:28px;margin:0 0 14px}h2{font-size:20px}p{line-height:1.6}label{display:block;margin:12px 0}input[type=text],textarea{width:100%;padding:12px;border:1px solid #b8c3d0;border-radius:8px;font:inherit}button,.btn{display:inline-block;background:#1764c0;color:white;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin-top:16px}.btn.secondary{background:#eaf1fa;color:#14539b}.choices label{border:1px solid #dbe2ea;padding:12px;border-radius:9px;cursor:pointer}.choices label:has(input:checked){background:#e9f2ff;border-color:#1764c0}.note{background:#f0f5fb;padding:14px;border-radius:10px}.ai{background:#eff8f6;border:1px solid #a9d7c7;padding:16px;border-radius:12px;margin:20px 0}.error{color:#b21e34}.muted{color:#607080}.bar{height:8px;background:#e6edf5;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#1764c0}small{color:#607080}@media(max-width:700px){main{margin:12px;padding:20px}}</style></head><body><main>{% block body %}{% endblock %}</main></body></html>
