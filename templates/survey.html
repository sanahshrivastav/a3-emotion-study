{% extends 'base.html' %}{% block body %}<h1>Almost finished</h1><p>Answer three quick questions about your experience in this condition.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>How mentally demanding was this task? (1 = not at all, 5 = extremely)<div class="choices">{% for i in range(1,6) %}<label style="display:inline-block"><input type="radio" name="workload" value="{{ i }}" required> {{ i }}</label>{% endfor %}</div></label><label>How confident were you in your answers? (1 = not confident, 5 = very confident)<div class="choices">{% for i in range(1,6) %}<label style="display:inline-block"><input type="radio" name="confidence" value="{{ i }}" required> {{ i }}</label>{% endfor %}</div></label><label>Optional feedback<textarea name="feedback" rows="3" maxlength="1000" placeholder="What felt easy or difficult?"></textarea></label><button type="submit">Submit study responses</button></form>{% endblock %}
